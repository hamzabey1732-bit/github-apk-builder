name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Bun kur
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Bağımlılıkları yükle
        run: bun install --frozen-lockfile

      - name: Tip kontrolü
        run: bunx --bun tsc --noEmit

      - name: Testleri çalıştır
        run: bun run test

      - name: Projeyi derle
        run: bun run build

      - name: Derleme çıktısını doğrula
        run: |
          if [ -d dist/client ]; then
            echo "dist/client mevcut, derleme başarılı."
          elif [ -d .output/public ]; then
            echo ".output/public mevcut, derleme başarılı."
          else
            echo "Derleme çıktısı bulunamadı. Klasör içeriği:"
            ls -la
            ls -la dist .output 2>/dev/null
            exit 1
          fi
  apk:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Bun kur
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Bağımlılıkları yükle
        run: bun install --frozen-lockfile

      - name: Web uygulamasını derle (Capacitor için)
        run: bun run build:capacitor

      - name: Android projesini eşitle
        run: bunx cap sync android

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK bileşenlerini kur
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager bulunamadı; Gradle eksik bileşenleri kendisi indirecek."
            exit 0
          fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle önbelleği
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: APK üret
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: APK'yı indirilebilir yap
        uses: actions/upload-artifact@v4
        with:
          name: ekpsstakip-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
